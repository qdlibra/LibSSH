[package]
name = "LibSSH"
version = "0.2.13"
edition = "2021"
authors = ["LibSSH contributors"]
description = "A lightweight FinalShell-style SSH/terminal client written in Rust + Slint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qdlibra/LibSSH"
readme = "README.md"
rust-version = "1.75"

[dependencies]
slint = { version = "1.8", features = ["compat-1-2"] }
# Direct access to the winit window/events (OS file-drop for drag-and-drop upload).
i-slint-backend-winit = "1.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
async-trait = "0.1"
futures = "0.3"
vt100 = "0.15"
russh-sftp = "2"
rfd = "0.15"
arboard = "3"
# Zeroes password buffers on drop so plaintext credentials don't linger in
# freed heap memory (core dumps / debuggers / /proc/pid/mem).
zeroize = "1"
# keyring 现仅用于「自动迁移旧版钥匙串密码」（读取 + 删除旧条目）。会话密码
# 改由机器绑定加密存储（见 src/secrets.rs 的 crypto 模块）；迁移在用户群普及
# 后的未来版本可移除此依赖。
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# app 自管密码加密：机器绑定密钥（HKDF-SHA256）+ XChaCha20-Poly1305 AEAD。
machine-uid = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
# SOCKS5 proxy tunnelling for SSH/SFTP in network-restricted environments.
# (HTTP CONNECT proxies are handled in src/proxy.rs without an extra crate.)
tokio-socks = "0.5"
base64 = "0.22"
# Auto-update: GitHub API 检测 + 流式下载 + 完整性校验。
# rustls-tls 避免 OpenSSL 系统依赖（与 russh 的 RustCrypto 栈一致）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
semver = "1"
sha2 = "0.10"
# 下载前磁盘空间预检（跨平台 available_space）。
fs2 = "0.4"
# 更新弹窗：把 release notes 的 markdown 解析成块序列做原生渲染（关默认 html 渲染器，仅用解析器）。
pulldown-cmark = { version = "0.13", default-features = false }

[build-dependencies]
slint-build = "1.8"
# 注入构建日期到「关于」对话框（约等于发版日期）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Embeds assets/LibSSH.ico into the .exe so Explorer / taskbar / shortcuts
# show the app icon. Windows-only; ignored on other targets.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
