name: Release

# Auto-release on version bump:
#   * Push to main  -> if Cargo.toml's version has no matching git tag yet,
#                       create v<version> and publish a GitHub Release.
#                       (A plain commit that does NOT touch the version is a no-op.)
#   * Push a v* tag -> release that tag directly (manual escape hatch / re-run).
#   * Manual run    -> build the selected ref and publish/update assets under
#                       the current Cargo.toml version tag.
#
# Note: the tag created here is pushed with the default GITHUB_TOKEN, and GitHub
# deliberately does NOT re-trigger workflows for token-pushed refs, so this can
# never loop back into itself.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Serialise release runs on the same ref so two quick pushes can't race on
# creating the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Determine release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail

          # Explicit tag push -> always release that tag, never re-create it.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push / manual run -> derive the tag from the package version.
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG="v$VERSION"
          echo "Cargo.toml version: $VERSION -> candidate tag $TAG"

          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Tag $TAG already exists; manual run will rebuild and update release assets."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG already exists; version unchanged, nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version detected; creating and pushing $TAG"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          if ! git push origin "$TAG"; then
            echo "Tag push failed (created concurrently?); skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
          - name: macos-arm64
            os: macos-15
          - name: macos-x86_64
            os: macos-15-intel
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.check.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libdbus-1-dev

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.name }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.name }}-cargo-release-
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo +stable build --release --locked

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p "dist/LibSSH-${{ matrix.name }}"
          cp target/release/LibSSH "dist/LibSSH-${{ matrix.name }}/"
          cp assets/LibSSH.desktop assets/icon@512.png assets/install-linux.sh README.md "dist/LibSSH-${{ matrix.name }}/"
          tar -czf "dist/LibSSH-${{ matrix.name }}.tar.gz" -C dist "LibSSH-${{ matrix.name }}"

          DEB_ROOT="dist/deb-root"
          rm -rf "$DEB_ROOT"
          mkdir -p \
            "$DEB_ROOT/DEBIAN" \
            "$DEB_ROOT/usr/bin" \
            "$DEB_ROOT/usr/share/applications" \
            "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          install -m 0755 target/release/LibSSH "$DEB_ROOT/usr/bin/LibSSH"
          install -m 0644 assets/LibSSH.desktop "$DEB_ROOT/usr/share/applications/LibSSH.desktop"
          install -m 0644 assets/icon@512.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/LibSSH.png"
          cat > "$DEB_ROOT/DEBIAN/control" <<EOF
          Package: libssh-app
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: LibSSH contributors
          Depends: libfontconfig1, libxkbcommon0, libxcb1, libxcb-render0, libxcb-shape0, libxcb-xfixes0, libdbus-1-3
          Description: Lightweight Rust + Slint SSH terminal client
          EOF
          sed -i 's/^          //' "$DEB_ROOT/DEBIAN/control"
          dpkg-deb --build "$DEB_ROOT" "dist/LibSSH-${{ matrix.name }}.deb"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          chmod +x scripts/package-macos-dmg.sh
          scripts/package-macos-dmg.sh target/release/LibSSH dist

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\release\LibSSH.exe -Destination dist\LibSSH-${{ matrix.name }}.exe -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibSSH-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [check, build]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f)
          # 生成 checksums.txt（sha256sum，文件名只保留 basename，供 App 自动更新校验）。
          : > checksums.txt
          for f in "${files[@]}"; do
            sha256sum "$f" | awk -v name="$(basename "$f")" '{print $1 "  " name}' >> checksums.txt
          done
          files+=("checksums.txt")
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --generate-notes --title "$TAG"
          fi
          # macOS 资产是 adhoc 签名（未公证），浏览器下载带 quarantine 后
          # Gatekeeper 会报「已损坏，无法打开」。把解决步骤固定放进 release
          # 说明开头（幂等：已有提示则跳过，避免覆盖人工编辑）。
          if ! gh release view "$TAG" --repo "$REPO" --json body -q .body | grep -q "macOS 安装提示"; then
            {
              echo "## macOS 安装提示"
              echo
              echo "dmg 未经 Apple 公证，首次打开可能提示「LibSSH 已损坏，无法打开」。这是 Gatekeeper 对未公证应用的拦截，不是文件损坏。解决："
              echo
              echo '1. 把 `LibSSH.app` 拖入「应用程序」文件夹；'
              echo '2. 终端执行 `xattr -dr com.apple.quarantine /Applications/LibSSH.app`；'
              echo "3. 重新打开。"
              echo
              gh release view "$TAG" --repo "$REPO" --json body -q .body
            } > final-notes.md
            gh release edit "$TAG" --repo "$REPO" --notes-file final-notes.md
          fi
